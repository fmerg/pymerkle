stages:
  - test
  - deploy

before_script:
  - apt-get update
  - python --version
  - pip3 install -r requirements.txt -r requirements-dev.txt

test:
  image: "python:${PYTHON_VERSION}-bookworm"
  stage: test
  interruptible: true
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
  script:
    - ./test.sh --extended
  coverage: '/TOTAL.*\s+(\d+%)$/'

pages:
  image: "python:3.12-bookworm"
  stage: deploy
  script:
    - pip3 install -r requirements-dev.txt
    - ./build-docs.sh
    - mv docs/target/build/html/ public/
  artifacts:
    paths:
      - public
  only:
    - feature-refactor
