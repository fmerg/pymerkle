# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Builds the Sphinx sources generated by build-docs.sh and tracked under
# docs/target/source

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/target/source/conf.py

python:
  install:
    - requirements: requirements.txt
    - requirements: requirements-dev.txt
